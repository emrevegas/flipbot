name: Build Flipbot Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.2)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython setuptools
          pip install -r requirements.txt

      - name: Ensure license public key in bundle
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
        run: |
          python -c "
          import os
          from pathlib import Path
          from licensing.control.license_sign import ensure_public_key_file
          ensure_public_key_file()
          print('Public key ready:', Path('licensing/control/license_public.pem').exists())
          "

      - name: Build Cython release
        env:
          RELEASES_GITHUB_REPO: ${{ secrets.RELEASES_GITHUB_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python licensing/build/build_release.py --version "${{ inputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flipbot-release-${{ inputs.version }}
          path: |
            dist/*.tar.gz
            dist/manifest-*.json
